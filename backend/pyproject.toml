[project]
name = "bhuintel-backend"
version = "0.1.0"
description = "BhuIntel: multi-source geospatial land-record harmonization platform (backend)"
requires-python = ">=3.12,<3.14"
# Versions verified together on Python 3.12 (GDAL 3.12 / GEOS 3.14 / PROJ 9.8 via wheels).
dependencies = [
    "fastapi>=0.161,<0.162",
    "uvicorn[standard]>=0.54,<0.55",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.16,<3",
    "sqlalchemy>=2.1,<2.2",
    "geoalchemy2>=0.20,<0.21",
    "alembic>=1.20,<1.21",
    "psycopg[binary]>=3.3,<3.4",
    "geopandas>=1.2,<1.3",
    "shapely>=2.2,<2.3",
    "pyogrio>=0.13,<0.14",
    "pyproj>=3.8,<3.9",
    "rasterio>=1.5,<1.6",
    "numpy>=2.5,<2.6",
    "pandas>=3.1,<3.2",
    "pyarrow>=26,<27",
    "scikit-learn>=1.9,<1.10",
    "joblib>=1.5",
    "opencv-python-headless>=5.0,<5.1",
    "rapidfuzz>=3.14,<4",
    "python-multipart>=0.0.32",
    "pyjwt>=2.15,<3",
    "argon2-cffi>=25.1",
    "httpx>=0.28,<0.29",
]

[project.optional-dependencies]
vision = ["onnxruntime>=1.23"]
dev = ["pytest>=9.1", "pytest-cov>=7.1", "ruff>=0.17"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "db: requires the PostGIS test database",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "B008", "S608"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "E501"]
"scripts/*" = ["S"]
