name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env: { POSTGRES_USER: bhuintel, POSTGRES_PASSWORD: bhuintel, POSTGRES_DB: bhuintel_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U bhuintel" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      BHU_TEST_DATABASE_URL: postgresql+psycopg://bhuintel:bhuintel@localhost:5432/bhuintel_test
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update && sudo apt-get install -y libexpat1
      - run: pip install -e ".[dev]"
      - run: ruff check app scripts tests
      - run: pytest --cov=app

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev
