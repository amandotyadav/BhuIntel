# BhuIntel: PostGIS + API + background worker + web UI.
# Copy .env.example to .env and set secrets before `docker compose up -d --build`.
name: bhuintel

x-backend: &backend
  build: { context: ./backend }
  image: bhuintel-backend:local
  env_file: .env
  environment:
    BHU_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bhuintel}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bhuintel}
    BHU_STORAGE_ROOT: /data/storage
  volumes:
    - storage:/data/storage
  depends_on:
    db: { condition: service_healthy }
  restart: unless-stopped

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bhuintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-bhuintel}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    deploy: { resources: { limits: { memory: 2g } } }

  api:
    <<: *backend
    environment:
      BHU_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-bhuintel}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-bhuintel}
      BHU_STORAGE_ROOT: /data/storage
      BHU_RUN_MIGRATIONS: "1"
    ports: ["127.0.0.1:8000:8000"]
    deploy: { resources: { limits: { memory: 2g, cpus: "2" } } }

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    healthcheck: { disable: true }
    depends_on:
      db: { condition: service_healthy }
      api: { condition: service_healthy }   # api applies migrations first
    deploy: { resources: { limits: { memory: 4g, cpus: "2" } } }

  web:
    build:
      context: ./frontend
      args:
        VITE_TILE_URL: ${VITE_TILE_URL:-https://tile.openstreetmap.org/{z}/{x}/{y}.png}
    image: bhuintel-web:local
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped

volumes:
  pgdata:
  storage:
